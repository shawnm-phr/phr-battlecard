<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeoplesHR Battle Cards</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/demo.css" />
</head>
<body>

<div class="demo-scope">
<div class="bc-app">

  <aside class="bc-side">
    <div class="bc-side-brand">
      <img src="img/logos/peopleshr.webp" alt="PeoplesHR" />
      <span>Sales Hub</span>
    </div>
    <nav class="bc-nav" aria-label="Sales tools">
      <ul>
        <li><a class="bc-nav-item is-active" href="#" aria-current="page">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h8l4 4v9H4z M12 3.5v4h4 M7 11h6M7 14h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          Battle cards</a></li>
        <li><span class="bc-nav-item" aria-disabled="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13v10h-13z M7 5.5V4h6v1.5 M3.5 10h13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          Case studies</span></li>
        <li><span class="bc-nav-item" aria-disabled="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v9H3z M10 13v3.5 M7 16.5h6 M7 10V8M10 10V6.5M13 10V8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          Sales decks</span></li>
        <li><span class="bc-nav-item" aria-disabled="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h10v14H5z M7.5 6h5 M7.5 9.5h1M10 9.5h0.5M12.5 9.5h0M7.5 12.5h1M10 12.5h0.5M12.5 12.5v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          Pricing calculator</span></li>
        <li><span class="bc-nav-item" aria-disabled="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5a4.5 4.5 0 00-4.5 4.5v3l-1.5 2.5h12L14.5 11V8A4.5 4.5 0 0010 3.5z M8.3 16a1.8 1.8 0 003.4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          Product updates</span></li>
      </ul>
    </nav>
  </aside>

  <main id="main" class="bc-page">

    <section class="bc-hero" aria-labelledby="bc-title">
      <p class="bc-eyebrow">Sales battle cards</p>
      <h1 id="bc-title" class="bc-title">Compare PeoplesHR</h1>

      <div class="bc-picker" id="bc-picker">
        <span class="bc-brand"><img class="bc-brand-logo" src="img/logos/peopleshr.webp" alt="PeoplesHR" /></span>

        <span class="bc-vs">vs</span>
        <div class="bc-slot" id="bc-slot-0">
          <label class="bc-sr" for="bc-select-0">Competitor</label>
          <img class="bc-slot-icon" id="bc-icon-0" alt="" hidden />
          <select class="bc-select" id="bc-select-0"></select>
        </div>

        <span class="bc-vs" id="bc-vs-1" hidden>vs</span>
        <div class="bc-slot" id="bc-slot-1" hidden>
          <label class="bc-sr" for="bc-select-1">Second competitor</label>
          <img class="bc-slot-icon" id="bc-icon-1" alt="" hidden />
          <select class="bc-select" id="bc-select-1"></select>
          <button type="button" class="bc-remove" id="bc-remove-1" aria-label="Remove second competitor">&times;</button>
        </div>

        <button type="button" class="bc-add" id="bc-add" hidden>+ Add competitor</button>
      </div>

      <p class="bc-hint" id="bc-hint">Select a competitor to see the battle card. You can compare up to two.</p>
    </section>

    <section class="bc-card" id="bc-card" aria-live="polite" hidden></section>

  </main>
</div>
</div>

<script src="js/demo.js"></script>
</body>
</html>
