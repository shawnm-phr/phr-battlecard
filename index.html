<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeoplesHR Battle Cards</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/demo.css" />
</head>
<body>

<div class="demo-scope">
<div class="bc-app">

  <aside class="bc-side" id="bc-side">
    <div class="bc-side-brand">
      <span class="bc-side-logo"><img src="img/logos/peopleshr.webp" alt="PeoplesHR" /></span>
      <span class="bc-side-tag">Sales Hub</span>
    </div>
    <nav class="bc-nav" aria-label="Sales tools">
      <ul>
        <li><a class="bc-nav-item is-active" href="#" aria-current="page" title="Battle cards">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h8l4 4v9H4z M12 3.5v4h4 M7 11h6M7 14h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="bc-nav-label">Battle cards</span></a></li>
        <li><span class="bc-nav-item" aria-disabled="true" title="Case studies">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13v10h-13z M7 5.5V4h6v1.5 M3.5 10h13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="bc-nav-label">Case studies</span></span></li>
        <li><span class="bc-nav-item" aria-disabled="true" title="Objection handling">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12a1 1 0 011 1v7a1 1 0 01-1 1H9l-3.5 3v-3H4a1 1 0 01-1-1v-7a1 1 0 011-1z M7 8.5h6M7 11h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="bc-nav-label">Objection handling</span></span></li>
        <li><span class="bc-nav-item" aria-disabled="true" title="Win/loss insights">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 16.5h13 M5.5 16.5V11 M9 16.5V7 M12.5 16.5v-4 M16 16.5V4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="bc-nav-label">Win/loss insights</span></span></li>
      </ul>
    </nav>
    <button type="button" class="bc-collapse" id="bc-collapse" aria-expanded="true" aria-controls="bc-side" title="Collapse menu">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5.5L7.5 10l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="bc-nav-label">Collapse</span>
    </button>
  </aside>

  <main id="main" class="bc-page">

    <section class="bc-hero" aria-labelledby="bc-title">
      <h1 id="bc-title" class="bc-title">Sales Battle Cards</h1>
      <p class="bc-hint" id="bc-hint">Select a competitor to get started. You can compare up to two.</p>

      <div class="bc-picker" id="bc-picker">
        <span class="bc-brand"><img class="bc-brand-logo" src="img/logos/peopleshr.webp" alt="PeoplesHR" /></span>

        <span class="bc-vs">vs</span>
        <div class="bc-slot" id="bc-slot-0">
          <label class="bc-sr" for="bc-select-0">Competitor</label>
          <img class="bc-slot-icon" id="bc-icon-0" alt="" hidden />
          <select class="bc-select" id="bc-select-0"></select>
          <button type="button" class="bc-remove" id="bc-remove-0" aria-label="Remove competitor" hidden>&times;</button>
        </div>

        <span class="bc-vs" id="bc-vs-1" hidden>vs</span>
        <div class="bc-slot" id="bc-slot-1" hidden>
          <label class="bc-sr" for="bc-select-1">Second competitor</label>
          <img class="bc-slot-icon" id="bc-icon-1" alt="" hidden />
          <select class="bc-select" id="bc-select-1"></select>
          <button type="button" class="bc-remove" id="bc-remove-1" aria-label="Remove second competitor">&times;</button>
        </div>

        <button type="button" class="bc-add" id="bc-add" hidden>+ Add competitor</button>
      </div>
    </section>

    <section class="bc-card" id="bc-card" aria-live="polite" hidden></section>

  </main>
</div>
</div>

<script src="js/demo.js"></script>
</body>
</html>
